{{- if .Values.forge.localPostgresql }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flowforge-database-policy
  labels:
  {{- include "forge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
  - Ingress
  ingress:
    - from:
      - podSelector:
          matchLabels:
            {{- include "forge.forgeSelectorLabels" . | nindent 12 }}
      - podSelector:
          matchLabels:
            {{- include "forge.fileStoreSelectorLabels" . | nindent 12 }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flowfuse-admin-hosted
  namespace: {{ .Values.forge.projectNamespace }}
spec:
  podSelector:
    matchLabels:
      nodered: 'true'
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              app: flowforge
      ports:
        - protocol: TCP
          port: 2880
    - ports:
        - protocol: TCP
          port: 1880
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flowfuse-admin-mqtt
  namespace: {{ .Values.forge.projectNamespace }}
spec:
  podSelector:
    matchLabels:
      mqttSchemaAgent: 'true'
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
          podSelector:
            matchLabels:
              app: flowforge
      ports:
        - protocol: TCP
          port: 3500